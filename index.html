/* Layout: one narrow column; sticky day header with progress strip, task cards, fixed three-tab bar at the bottom */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --ink:#14302E; --muted:#56706C; --line:#D2DFDC;
  --accent:#11697A; --accent-ink:#FFFFFF; --accent-soft:#DAEBEC;
  --warn:#8A5300; --warn-soft:#FAEED3;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root{color-scheme:light only}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;display:grid;gap:8px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.app{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.day{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.1}
.day small{font-size:16px;color:var(--muted);font-family:var(--body);font-weight:400;margin-left:6px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:10px 4px;min-height:44px}
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.strip i{height:6px;border-radius:3px;background:var(--line)}
.strip i.done{background:var(--accent);opacity:.45}
.strip i.cur{background:var(--accent)}
main{display:grid;gap:22px;padding-top:6px}
section{display:grid;gap:10px}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.now{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:16px;display:grid;gap:12px}
.now h2{font-family:var(--display);font-weight:600;font-size:22px}

.item.late .when{color:var(--warn);font-weight:700}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;padding:0}

form{display:grid;gap:20px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px}
legend{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0;margin-bottom:10px}
.f{display:grid;gap:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

input[type=time],input[type=datetime-local],input[type=tel],input[type=number],input[type=text]{width:100%;min-height:50px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.check{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.check input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.check span small{display:block;color:var(--muted);font-size:14px}
.medset{display:grid;gap:8px}
.medset .f{padding:0 4px 4px 48px}
.intro{display:grid;gap:6px}

/* ---- pilot-site additions ---- */

html{background:var(--bg)}
body{margin:0;overflow-x:hidden}
.wrap{padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:block}
.topin{display:grid;gap:8px}
.brand{display:grid;gap:0;min-width:0}
.prac{font-size:14px;color:var(--muted);overflow-wrap:anywhere}

.pv label{font-weight:700;color:var(--warn)}
.pv input{width:100%;accent-color:var(--warn);margin:0}
.safety{max-width:560px;margin:0 auto 6px;font-size:13px;line-height:1.35;color:var(--muted);text-align:center}
.safety a{color:var(--accent);font-weight:700;white-space:nowrap}
.privacy{font-size:14px;color:var(--muted)}
.consent{font-size:15px;color:var(--ink);font-weight:700}
.calsub{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.survey a.btn{color:var(--accent-ink);text-decoration:none}
.fbwhat{margin:4px 0 10px;font-size:14px;color:var(--muted)}.fbwhat summary{cursor:pointer;text-decoration:underline}
#help-fb a{color:var(--accent);font-weight:700}
.remind{display:grid;gap:2px;justify-items:start}
a.gc{color:var(--accent);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px 2px;min-height:32px;display:inline-flex;align-items:center}
.due .tk{font-size:17px;font-weight:700;color:var(--muted)}
.medrem{background:var(--accent-soft);border:2px solid transparent}
.medrem.miss{background:var(--warn-soft);border-color:var(--warn)}
.medrem h2{font-family:var(--display);font-weight:600;font-size:22px}
.mr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.mr>p,.mr>.msg{grid-column:1/-1}
.mr>p.ln{grid-column:auto}
.mr .remind{justify-items:center}
.medrem .msg{background:var(--surface)}
.mr+.mr{border-top:1px solid var(--line);padding-top:10px}
.callout{border:2px solid var(--warn)}
.linkbtn.u{text-decoration:underline;text-underline-offset:3px;font-size:15px}
.tae{gap:8px}
.tae label{font-weight:700;font-size:15px}
.item .full{grid-column:1/-1;display:grid;gap:8px;margin-top:-8px;min-width:0}
.item .full>.linkbtn{justify-self:end}
/* collapsed groups: "Every day" rules on Today, meal and sleep times in Setup */
.fold summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 2px;color:var(--accent);font-weight:700;cursor:pointer}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:'';flex:none;width:0;height:0;border-style:solid;border-width:6px 0 6px 9px;border-color:transparent transparent transparent currentColor;transition:transform .15s}
.fold[open] summary::before{transform:rotate(90deg)}

<body>
<div class="wrap">
  <header class="top" id="hdr"><div id="pv" class="pv" hidden></div><div id="top" class="topin"></div></header>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections">
  <p class="safety" id="safety"></p>
  <div id="tabbtns">
  <button type="button" data-act="tab:today">Today</button>
  <button type="button" data-act="tab:meds">Medicines</button>
  <button type="button" data-act="tab:help">Help</button>
  </div>
</nav>

<script>
/* =====================================================================
   CONFIG: the only settings you need to change for a pilot.
   ===================================================================== */
const CONFIG = {
  // Practice details. Leave a value as '' to let the patient type it in at setup.
  //   name:   shown subtly in the header and on the Help tab.
  //   phone:  clinic phone. When filled, the "Clinic phone" setup field is hidden.
  //   mobile: periodontist's mobile. When filled, the "Periodontist mobile" setup field is hidden.
  practice: { name: '', phone: '', mobile: '' },
  // Clinic number already filled in at setup (public practice landline). The patient can still change it.
  prefill: { phone: '020 7580 0999' },

  // true  = the app works out "next due" times for each medicine, puts doses in
  //         Today's Now/Later lists, warns about early doses and offers a calendar reminder
//         for the next dose, one dose at a time (never a fixed series in the calendar file).
  // false = the Medicines tab only logs "Taken now" / "Last taken"; the patient follows
  //         the timing on their prescription label. No medicine times anywhere.
  medTiming: true,

  // Salt-water rinses run on days 1..rinseDays (the sheet says 3-4 days in one place, 7 in another).
  rinseDays: 7,

  // Day on which gentle brushing of the gum graft area can start (sheet: 1 week general rule, 2 weeks for grafts).
  graftBrushDay: 14,

  // Feedback form link (e.g. a Google Form). '' hides every feedback prompt. When filled:
  //   day 3-4: a short "How is it going?" check-in card on Today (until tapped or dismissed)
  //   day 12 on: an end-of-recovery survey card on Today (until tapped or dismissed)
  //   always: a "Send feedback or report a problem" link on the Help tab
  feedbackUrl: 'https://docs.google.com/forms/d/e/1FAIpQLScimruOTqPaSp6uRjTvVLK0ViTCbCB6NSl5WyarHh1DsHUfHw/viewform',
  // Optional: the Google Form pre-fill field for "which stage", e.g. 'entry.123456789'.
  // When set, each link fills it with "Day 3 check-in", "Day 12 survey" or "Help tab".
  feedbackStageField: 'entry.1316894452',
  // Optional: the pre-fill field for an anonymous usage summary on the day 12 survey, e.g. 'entry.987654321'.
  // When set, the day 12 card offers an unticked "Include an anonymous summary" box and shows exactly
  // what it would send (counts only: no medicine names, times or dates). '' hides the box.
  usageField: 'entry.1350557695'
};
/* Testers: add ?preview or #preview to the address to get a day slider (day 0-14). */

/*PURE-START*/
const MEDS = {
  paracetamol:{name:'Paracetamol',dose:'2 × 500 mg',h:8,kind:'pain',notes:['2 × 500 mg every 8 hours, taken 4 hours after ibuprofen.','Pain medicine is taken after eating.']},
  ibuprofen:{name:'Ibuprofen',dose:'1 × 400 mg',h:8,kind:'pain',notes:['1 × 400 mg every 8 hours, for at least 3 days.','Pain medicine is taken after eating.']},
  cocodamol:{name:'Co-codamol',dose:'30/500 mg, 1 tablet',h:6,kind:'pain',notes:['30/500 mg, 1 every 6 hours for pain, taken 4 hours after ibuprofen.','Pain medicine is taken after eating.']},
  metronidazole:{name:'Metronidazole',dose:'400 mg',h:8,kind:'abx',notes:['400 mg every 8 hours, with food, no alcohol.']},
  amoxicillin:{name:'Amoxicillin',dose:'500 mg, 1 capsule',h:8,kind:'abx',notes:['500 mg, 1 capsule 3 times a day until finished.','Can interfere with the contraceptive pill and can cause thrush.']},
  sudafed:{name:'Sudafed',dose:'1 tablet',h:12,kind:'prn',notes:['1 tablet every 12 hours.','For sinus lifts. Only when needed.']},
  sinex:{name:'Sinex nasal spray',dose:'1–2 sprays',h:6,kind:'prn',notes:['1–2 sprays every 6–8 hours if the nostril feels blocked.','For sinus lifts.']}
};
const ABX_NOTE = 'Take until all are finished. Stop and call the clinic or GP if there is a rash, itching or an upset stomach.';
const RINSE = 'Gentle rinse: ½ teaspoon of salt in 8 oz (about 240 ml) of warm water.';
const CURA = 'Rinse for 60 seconds, 30 minutes before or after toothpaste.';
const PROBIO = 'Daily for 3 days after finishing antibiotics.';
const MEALS = [['breakfast','breakfast'],['lunch','lunch'],['dinner','dinner']];
const PLAN_DAYS = 14, STRENUOUS_DAYS = 7;
const H = 36e5, MIN = 6e4;

const pad = n => String(n).padStart(2,'0');
const hm = s => { const [a,b] = String(s||'0:0').split(':').map(Number); return (a||0)*60 + (b||0); };
const at = (d,s) => { const m = hm(s); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(m/60), m%60); };
const addMin = (d,m) => new Date(d.getTime() + m*MIN);
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n, d.getHours(), d.getMinutes());
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const sameDay = (a,b) => midnight(a).getTime() === midnight(b).getTime();
const dayIdx = (s,d) => Math.round((midnight(d) - midnight(s)) / 864e5);
const fmt = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dateKey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
// bedtime for the night that follows day D (handles bedtimes after midnight)
const bedAt = (D,wake,bed) => hm(bed) < hm(wake) ? at(addDays(D,1),bed) : at(D,bed);

function asleep(d, wake, bed){
  const m = d.getHours()*60 + d.getMinutes(), w = hm(wake), b = hm(bed);
  if (b === w) return false;
  return b > w ? (m >= b || m < w) : (m >= b && m < w);
}
// Move a time that falls during sleep to the next wake-up time. Never moves earlier.
function shiftToWake(d, wake, bed){
  if (!asleep(d, wake, bed)) return new Date(d);
  const m = d.getHours()*60 + d.getMinutes();
  return m < hm(wake) ? at(d, wake) : at(addDays(d,1), wake);
}
// Next dose = last dose + full interval, then pushed to wake time if asleep.
function nextDue(last, hours, wake, bed){ return shiftToWake(new Date(last.getTime() + hours*H), wake, bed); }

// Turn the entered "HH:MM" next-dose time into a real date, relative to setup time / surgery.
function resolveNext(hhmm, base){
  if (!hhmm) return null;
  let t = at(base, hhmm);
  if (t < addMin(base,-60)) t = addDays(t,1);
  return t;
}
function medStart(st, data, k){
  const log = (data.doses && data.doses[k]) || [];
  if (log.length) return nextDue(new Date(log[log.length-1]), MEDS[k].h, st.wake, st.bed);
  const m = st.meds[k];
  return m && m.nextAt ? shiftToWake(new Date(m.nextAt), st.wake, st.bed) : null;
}

// Texts that depend on CONFIG.rinseDays / CONFIG.graftBrushDay.
const BRUSH_TXT = 'Gum graft area: you can now start gentle brushing there.';
function endRinseText(cfg){
  return cfg.rinseDays === STRENUOUS_DAYS
    ? 'Salt-water rinses (days 1–' + cfg.rinseDays + ') and the days of no strenuous activity (days 0–' + STRENUOUS_DAYS + ') are finished.'
    : null;
}

// Routine (non-medicine) tasks for calendar day D.
function tasksFor(st, data, D, cfg){
  const s = new Date(st.surgery), n = dayIdx(s, D), out = [];
  if (n === 0){
    const t = sameDay(s,D) ? s : at(D, st.wake);
    out.push({id:'pain0', t, title:'Take pain medicine before the numbness wears off'});
    out.push({id:'ice0', t, title:'Ice pack on the face', detail:'20 minutes on and 20 minutes off, for the rest of the day.'});
  }
  if (n >= 1 && n <= cfg.rinseDays){
    const meals = (data.meals||[]).map(x => new Date(x)).filter(x => sameDay(x,D)), used = new Set();
    for (const [k,label] of MEALS){
      const mt = at(D, st[k]);
      let t = addMin(mt,15);
      const i = meals.findIndex((x,j) => !used.has(j) && Math.abs(x - mt) <= 2*H);
      if (i >= 0){ used.add(i); t = meals[i]; }
      out.push({id:'rinse-'+k, t, title:'Salt-water rinse after '+label, detail:RINSE});
    }
    meals.forEach((x,j) => { if (!used.has(j)) out.push({id:'rinse-'+x.getTime(), t:x, title:'Salt-water rinse after your meal', detail:RINSE}); });
  }
  if (st.curasept && n >= 4 && n <= PLAN_DAYS){
    out.push({id:'cura-am', t:addMin(at(D,st.wake),30), title:'Curasept rinse (morning)', detail:CURA});
    out.push({id:'cura-pm', t:addMin(bedAt(D,st.wake,st.bed),-30), title:'Curasept rinse (before bed)', detail:CURA});
  }
  const fin = data.finished || {};
  if (Object.values(fin).some(iso => { const k = dayIdx(new Date(iso), D); return k >= 0 && k <= 2; }))
    out.push({id:'probiotic', t:at(D,st.breakfast), title:'Probiotic drink or yogurt', detail:PROBIO});
  return out.sort((a,b) => a.t - b.t);
}

// Google Calendar "add event" links (one at a time).
const gStamp = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
function gcalURL(t, mins, title, details, count){
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
  const q = new URLSearchParams({action:'TEMPLATE', text:title, dates:gStamp(t)+'/'+gStamp(addMin(t,mins||15)), details:details||''});
  if (tz) q.set('ctz', tz);
  if (count > 1) q.set('recur', 'RRULE:FREQ=DAILY;COUNT=' + count);
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
// Daily routines and milestones, as one link each.
function calLinks(st, cfg){
  const s = new Date(st.surgery), d0 = midnight(s), W = st.wake, B = st.bed, L = [], R = cfg.rinseDays;
  const day = n => addDays(d0, n);
  for (const [k,label] of MEALS) L.push({label:'Salt rinse after '+label, when:'Daily, days 1–'+R+', '+fmt(addMin(at(d0,st[k]),15)), url:gcalURL(addMin(at(day(1),st[k]),15),15,'Salt-water rinse after '+label,RINSE,R)});
  if (st.curasept){
    L.push({label:'Curasept rinse (morning)', when:'Daily, days 4–14', url:gcalURL(addMin(at(day(4),W),30),15,'Curasept rinse (morning)',CURA,11)});
    L.push({label:'Curasept rinse (before bed)', when:'Daily, days 4–14', url:gcalURL(addMin(bedAt(day(4),W,B),-30),15,'Curasept rinse (before bed)',CURA,11)});
  }
  L.push({label:'End of the 48 hours with no smoking or alcohol', when:'One reminder', url:gcalURL(shiftToWake(addMin(s,48*60),W,B),15,'48 hours since surgery','The first 48 hours with no smoking and no alcohol are over.',1)});
  L.push({label:'Day '+cfg.graftBrushDay+': gentle brushing of the graft area can start', when:'One reminder', url:gcalURL(addMin(at(day(cfg.graftBrushDay),W),60),15,'Gum graft area: gentle brushing can start',BRUSH_TXT,1)});
  return L;
}

// Every routine reminder for the 2-week plan as single events {t, mins, title, details}.
// No medicine doses: a fixed series can't follow late doses, so those are added one at a time (doseEvent).
function planEvents(st, data, cfg){
  const s = new Date(st.surgery), d0 = midnight(s), W = st.wake, B = st.bed, ev = [];
  const day = n => addDays(d0, n);
  for (let n = 1; n <= cfg.rinseDays; n++)
    for (const [k,label] of MEALS) ev.push({t:addMin(at(day(n),st[k]),15), mins:15, title:'Salt-water rinse after '+label, details:RINSE});
  if (st.curasept) for (let n = 4; n <= PLAN_DAYS; n++){
    ev.push({t:addMin(at(day(n),W),30), mins:15, title:'Curasept rinse (morning)', details:CURA});
    ev.push({t:addMin(bedAt(day(n),W,B),-30), mins:15, title:'Curasept rinse (before bed)', details:CURA});
  }
  ev.push({t:shiftToWake(addMin(s,48*60),W,B), mins:15, title:'48 hours since surgery', details:'The first 48 hours with no smoking and no alcohol are over.'});
  const both = endRinseText(cfg);
  if (both) ev.push({t:addMin(at(day(cfg.rinseDays+1),W),60), mins:15, title:'Salt rinses and no-strenuous-activity days are over', details:both});
  else {
    ev.push({t:addMin(at(day(cfg.rinseDays+1),W),60), mins:15, title:'Salt-water rinses are finished', details:'Salt-water rinses (days 1–'+cfg.rinseDays+') are finished.'});
    ev.push({t:addMin(at(day(STRENUOUS_DAYS+1),W),60), mins:15, title:'No-strenuous-activity days are over', details:'The days of no strenuous physical activity (days 0–'+STRENUOUS_DAYS+') are finished.'});
  }
  ev.push({t:addMin(at(day(cfg.graftBrushDay),W),60), mins:15, title:'Gum graft area: gentle brushing can start', details:BRUSH_TXT});
  return ev.sort((a,b) => a.t - b.t);
}

// ---- iCalendar (.ics) ----
const icsStamp = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
const icsUTC = d => d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
const icsText = s => String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
// Fold content lines at 75 octets (UTF-8), continuation lines start with a space.
function icsFold(line){
  const out = []; let cur = '', bytes = 0;
  for (const ch of line){
    const c = ch.codePointAt(0), b = c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
    if (bytes + b > 75){ out.push(cur); cur = ' '; bytes = 1; }
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n');
}
// One medicine dose as a single event. The details remind that a late dose moves the next one.
function doseEvent(k, t){
  const med = MEDS[k];
  return {t, mins:10, title:med.name+' '+med.dose, details:med.notes.join(' ') + (med.kind === 'abx' ? ' ' + ABX_NOTE : '') +
    ' If your last dose was late, wait the full ' + med.h + ' hours from when you took it. Open the app to check the right time. Never take two doses at once.'};
}
// Write events as a calendar file. Times are floating (local wall-clock) so they match the patient's day.
function icsDoc(ev, opts){
  opts = opts || {};
  const stamp = icsUTC(opts.now || new Date()), seed = opts.seed || Date.now().toString(36);
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Graft Recovery Companion//Pilot//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Graft recovery'];
  ev.forEach((e,i) => {
    L.push('BEGIN:VEVENT', 'UID:grc-' + seed + '-' + i + '-' + icsStamp(e.t) + '@graft-recovery', 'DTSTAMP:' + stamp,
      'DTSTART:' + icsStamp(e.t), 'DTEND:' + icsStamp(addMin(e.t, e.mins||15)),
      'SUMMARY:' + icsText(e.title), 'DESCRIPTION:' + icsText(e.details||''), 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText(e.title), 'TRIGGER:-PT0M', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return {text: L.map(icsFold).join('\r\n') + '\r\n', count: ev.length};
}
// The whole plan file (routines and milestones).
function buildICS(st, data, cfg, opts){
  const from = (opts && opts.from) || null;
  return icsDoc(planEvents(st, data, cfg).filter(e => !from || e.t >= from), opts);
}
// A single next-dose reminder file.
const buildDoseICS = (k, t, opts) => icsDoc([doseEvent(k, t)], opts);
/*PURE-END*/

const KEY = 'graftRecovery.v1';
const blank = () => ({setup:null, ticks:{}, doses:{}, meals:[], finished:{}, reminded:{}, fb:{}, use:{days:[], doseCal:0, allCal:0}});
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}
if (!S.reminded || typeof S.reminded !== 'object') S.reminded = {};   // older saved data
if (!S.fb || typeof S.fb !== 'object') S.fb = {};
if (!S.use || typeof S.use !== 'object') S.use = {days:[], doseCal:0, allCal:0};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const P = CONFIG.practice || {};
const clinicNum = () => P.phone || (S.setup && S.setup.clinic) || '';
const perioNum = () => P.mobile || (S.setup && S.setup.perio) || '';

/* ---------- preview mode (testers only: ?preview or #preview) ---------- */
const PREVIEW = /preview/i.test(location.search + location.hash);
let previewDay = null;
// The app's idea of "now". In preview mode: surgery date + N days, at the real time of day.
function appNow(){
  const real = new Date();
  if (!PREVIEW || previewDay == null || !S.setup) return real;
  const d = addDays(midnight(new Date(S.setup.surgery)), previewDay);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), real.getHours(), real.getMinutes(), real.getSeconds());
}
function renderPreview(){
  const el = $('#pv');
  if (!PREVIEW || !S.setup){ el.hidden = true; el.innerHTML = ''; return; }
  if (previewDay == null) previewDay = Math.max(0, Math.min(PLAN_DAYS, dayIdx(new Date(S.setup.surgery), new Date())));
  el.hidden = false;
  if (!$('#pv-range')){
    el.innerHTML = `<label for="pv-range" id="pv-label"></label><input type="range" id="pv-range" min="0" max="${PLAN_DAYS}" step="1">`;
    $('#pv-range').addEventListener('input', e => { previewDay = +e.target.value; flash = {}; $('#pv-label').textContent = pvLabel(); if (tab !== 'setup') render(); });
  }
  $('#pv-range').value = previewDay;
  $('#pv-label').textContent = pvLabel();
}
const pvLabel = () => 'Preview: day ' + previewDay + ' (testing only)';

let tab = S.setup ? 'today' : 'setup';
let flash = {};          // transient inline messages
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const telHref = num => 'tel:' + esc(String(num).replace(/[^\d+]/g,''));
const longDay = d => d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
const whenStr = (d, now) => sameDay(d, now) ? fmt(d) : (sameDay(d, addDays(midnight(now),1)) ? 'tomorrow ' + fmt(d) : longDay(d) + ' ' + fmt(d));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PRIVACY = 'This is a trial app. Everything you enter stays on this phone. Nothing is sent anywhere.'
  + (CONFIG.feedbackUrl ? (CONFIG.usageField ? ' Feedback forms are optional and only send what you type or choose to share.' : ' Feedback forms are optional and only send what you type into them.') : '');
// Feedback form link for one stage (pre-fills the stage when feedbackStageField is set).
function fbHref(stage, usage){
  const u = CONFIG.feedbackUrl, q = [];
  if (CONFIG.feedbackStageField) q.push(encodeURIComponent(CONFIG.feedbackStageField) + '=' + encodeURIComponent(stage));
  if (usage && CONFIG.usageField) q.push(encodeURIComponent(CONFIG.usageField) + '=' + encodeURIComponent(usage));
  return q.length ? u + (u.includes('?') ? '&' : '?') + 'usp=pp_url&' + q.join('&') : u;
}
// Anonymous usage summary for the day 12 survey: counts only, built on the phone, sent only if the patient ticks the box.
let shareUsage = false;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
function usageSummary(now){
  const n = dayIdx(new Date(S.setup.surgery), now), ks = activeMeds();
  const doses = ks.reduce((a, k) => a + (S.doses[k] || []).length, 0);
  const ua = navigator.userAgent, phone = /iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : 'other';
  return [`Recovery day ${n}`, `opened on ${plural(S.use.days.length, 'day')}`, `${plural(Object.keys(S.ticks).length, 'task')} ticked`,
    `${plural(ks.length, 'medicine')}, ${plural(doses, 'dose')} logged`, `${plural(S.use.doseCal, 'next-dose reminder')} saved`,
    `all-reminders file ${S.use.allCal ? 'used' : 'not used'}`, `“I’ve just eaten” ${S.meals.length}×`, phone].join(' · ');
}
// Today: a feedback card that stays until the patient opens the form or taps "Not now" (S.fb[id]).
function fbCardHTML(id, title, text, btn, stage, now){
  if (S.fb[id]) return '';
  const usage = now && CONFIG.usageField ? usageSummary(now) : '';
  const share = usage ? `<label class="check"><input type="checkbox" id="fb-share" ${shareUsage ? 'checked' : ''}><span>Include an anonymous summary of how I used the app<small>Counts only. No names, medicine names or times.</small></span></label>
    <details class="fbwhat"><summary>See exactly what’s shared</summary><p id="fb-usage">${esc(usage)}</p></details>` : '';
  return `<section class="card survey" id="fb-${id}"><h3>${title}</h3><p>${text}</p>${share}
    <div class="row"><a class="btn small" id="fb-go-${id}" data-stage="${esc(stage)}" href="${esc(fbHref(stage, usage && shareUsage ? usage : ''))}" target="_blank" rel="noopener" data-act="fb:${id}">${btn}</a><button type="button" class="btn small line" data-act="fb:${id}">Not now</button></div></section>`;
}

function defaults(){
  // Surgery time starts at 2 hours before now, rounded to the nearest hour (most patients set up on the way home).
  const n = new Date(Date.now() - 2*H + 30*60000); n.setMinutes(0, 0, 0);
  const meds = {}; Object.keys(MEDS).forEach(k => meds[k] = {on:false, next:'', nextAt:null});
  return {surgery: dateKey(n) + 'T' + String(n.getHours()).padStart(2,'0') + ':00', wake:'07:00', bed:'22:30', breakfast:'08:00', lunch:'12:30', dinner:'18:30',
          sedation:false, curasept:false, meds, abxDays:7, clinic:(CONFIG.prefill||{}).phone||'', perio:''};
}
const activeMeds = () => Object.keys(MEDS).filter(k => S.setup.meds[k] && S.setup.meds[k].on);
const isFinished = k => !!S.finished[k] || autoEnded(k);
// Antibiotic course end: course length (days) from the first logged dose, or from surgery if none is logged yet.
function courseEnd(k){
  if (!S.setup) return null;
  const days = +S.setup.abxDays; if (MEDS[k].kind !== 'abx' || !(days > 0)) return null;
  const log = (S.doses[k] || []).slice().sort();
  return new Date((log.length ? new Date(log[0]) : new Date(S.setup.surgery)).getTime() + days*24*H);
}
// Once the course length has passed, the course counts as finished: reminders stop (the button still works earlier).
// Worked out each time (not saved), so the #preview day slider can go back and forth.
const autoEnded = k => { if (S.finished[k]) return false; const e = courseEnd(k); return !!e && appNow() >= e; };
const finishedAt = k => S.finished[k] ? new Date(S.finished[k]) : courseEnd(k);
const finMap = () => { const m = Object.assign({}, S.finished); for (const k of activeMeds()) if (autoEnded(k)) m[k] = courseEnd(k).toISOString(); return m; };
// A calendar reminder was added for exactly this next-dose time (S.reminded: medKey -> ISO).
const isReminded = (k, nd) => !!nd && S.reminded[k] === nd.toISOString();
function markReminded(k){
  const nd = medStart(S.setup, S, k);
  if (!nd || nd <= appNow()) return null;
  S.reminded[k] = nd.toISOString(); S.use.doseCal++; save(); return nd;
}
const gcalDose = (k, nd) => { const ev = doseEvent(k, nd); return gcalURL(nd, ev.mins, ev.title, ev.details, 1); };
// One calendar button per next dose: the .ics file, with Google Calendar as a small link under it.
function remindBtnHTML(k, nd, now, done){
  const lbl = done ? 'Add again' : 'Remind me';
  return `<div class="remind"><button type="button" class="btn small ${done ? 'line' : ''}" data-act="dose-ics:${k}" aria-label="${lbl}: ${esc(MEDS[k].name)} ${esc(whenStr(nd, now))}">${lbl}</button>
    <a class="gc" href="${esc(gcalDose(k, nd))}" target="_blank" rel="noopener" data-act="gcal:${k}">or Google Calendar</a></div>`;
}
// A web page can't tell whether the calendar saved the event, so ask (flash.confirm = {k, iso, via}); only "Yes" records it.
const pendingConfirm = (k, nd) => !!nd && !!flash.confirm && flash.confirm.k === k && flash.confirm.iso === nd.toISOString();
function confirmHTML(k, nd, now){
  if (!pendingConfirm(k, nd)) return '';
  const tip = flash.confirm.via === 'gcal' ? 'Tap Save in the Google Calendar tab, then come back.' : 'Open the downloaded file and tap Add, then come back.';
  return `<div class="msg" role="status"><p>${esc(tip)} Did the reminder for ${esc(whenStr(nd, now))} save in your calendar?</p><div class="row"><button type="button" class="btn small" data-act="remind-yes:${k}">Yes, it’s saved</button><button type="button" class="btn small line" data-act="remind-no:${k}">No, try again</button></div></div>`;
}
// Time of the dose just logged (flash.taken), shown next to the next-dose time instead of a separate note.
const justTaken = k => { const last = (S.doses[k]||[]).slice(-1)[0]; return flash.taken === k && last ? new Date(last) : null; };

/* ---------- "Took it earlier?": log a dose at a past time (flash.takeAt = medicine key, one form at a time) ---------- */
const takeAtBtn = k => `<button type="button" class="linkbtn u" data-act="take-at:${k}" aria-expanded="${flash.takeAt === k}">Took it earlier?</button>`;
function takeAtHTML(k){
  if (flash.takeAt !== k) return '';
  const err = flash.takeAtErr;
  return `<div class="msg tae" id="tae-${k}"><label for="tat-${k}">What time did you take it?</label>
    <input type="time" id="tat-${k}" value="${esc(flash.takeAtVal||'')}"${err ? ` aria-invalid="true" aria-describedby="tae-err-${k}"` : ''}>
    ${err ? `<p class="msg warn" id="tae-err-${k}" role="alert">${esc(err)}</p>` : ''}
    <div class="row"><button type="button" class="btn small" data-act="take-at-save:${k}">Save</button><button type="button" class="btn small line" data-act="take-at-no">Cancel</button></div></div>`;
}
// Same early-dose warning as "Taken", for a chosen past time (flash.earlyAt = ISO).
function earlyAtHTML(k){
  const nd = medStart(S.setup, S, k), t = fmt(new Date(flash.earlyAt));
  return `<div class="msg warn" role="alert"><p>It wasn’t ${esc(nd ? fmt(nd) : '')} yet at ${t}. The gap between doses should not be shortened. Log a dose taken at ${t} anyway?</p>
    <div class="row"><button type="button" class="btn small" data-act="take-at-force:${k}">Yes, I took it</button><button type="button" class="btn small line" data-act="early-no">No, go back</button></div></div>`;
}
const focusTakeAt = () => { const el = flash.takeAt && document.getElementById('tat-' + flash.takeAt); if (el) el.focus(); };
// "HH:MM" = its most recent past occurrence (today, or yesterday if later than now). Returns {t} or {err}.
function takeAtTime(k, v, now){
  if (!/^\d\d:\d\d$/.test(v || '')) return {err:'Enter the time you took it.'};
  let t = at(now, v);
  if (t > now){ if (t - now <= 12*H) return {err:'That time is in the future.'}; t = addDays(t, -1); }
  if (now - t > 12*H) return {err:'Choose a time in the last 12 hours.'};
  const log = (S.doses[k] || []).slice().sort(), last = log.length ? new Date(log[log.length-1]) : null;
  if (last && t <= last) return {err:'That’s before your last dose at ' + whenStr(last, now) + '.'};
  return {t};
}
function addDose(k, t){
  const L = S.doses[k] = S.doses[k] || [];
  L.push(t.toISOString()); L.sort();   // ISO strings sort by time
  flash.takeAt = null; flash.takeAtErr = null; flash.early = null; flash.earlyAt = null; flash.taken = k;
  save(); render();
}

/* ---------- rendering ---------- */
function render(){
  const now = appNow();
  if (S.setup){ const dk = dateKey(new Date()); if (!S.use.days.includes(dk)){ S.use.days.push(dk); S.use.days = S.use.days.slice(-30); save(); } }   // days opened (real date, not preview)
  document.querySelectorAll('#tabs button').forEach(b => { if (b.dataset.act === 'tab:'+tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#tabbtns').hidden = !S.setup;
  renderPreview();
  renderSafety();
  renderTop(now);
  // keep a half-typed "Took it earlier?" time (and its focus) across the 1-minute refresh
  const ti = flash.takeAt && document.getElementById('tat-' + flash.takeAt), foc = !!ti && document.activeElement === ti;
  if (ti) flash.takeAtVal = ti.value;
  const m = $('#main');
  if (tab === 'setup') m.innerHTML = setupHTML();
  else if (tab === 'meds') m.innerHTML = medsHTML(now);
  else if (tab === 'help') m.innerHTML = helpHTML();
  else m.innerHTML = todayHTML(now);
  if (tab === 'setup') wireSetup();
  if (foc) focusTakeAt();
}

    <button type="button" class="linkbtn" data-act="tab:setup">Settings</button></div>
    <div class="top-row"><h1 class="day">${title}</h1><span class="sub">${esc(longDay(now))} · ${fmt(now)}</span></div>
    <div class="strip" role="img" aria-label="Day ${Math.max(0,Math.min(n,PLAN_DAYS))} of 14">${strip}</div>`;
}

// [text, class, firstDay]. firstDay marks a standing rule: shown in the list on the day it starts,
// then inside the closed "Every day" fold on the days after.
function dayNotes(n, s, now){
  const st = S.setup, out = [];
  if (n === 0) out.push(['Go home and rest.'], ['While numb, don’t bite your lips or tongue and don’t push the dressing.']);
  if (st.sedation && now < new Date(s.getTime() + 24*H) && now >= addMin(s,-12*60))
    out.push(['After sedation, until ' + whenStr(new Date(s.getTime()+24*H), now) + ': don’t drive, use heavy machinery, sign legal documents or look after children.', 'warn']);
  if (now < new Date(s.getTime() + 48*H) && n >= 0) out.push(['No smoking and no alcohol until ' + whenStr(new Date(s.getTime()+48*H), now) + ' (first 48 hours).', 'warn']);
  if (n === 1) out.push(['You can return to work.']);
  if (n >= 1 && n < CONFIG.graftBrushDay) out.push(['Brush and floss the areas away from the surgery as normal.', '', 1]);
  if (n === 3) out.push(['Swelling often peaks today. Ice packs help.']);
  if (n >= 0 && n <= STRENUOUS_DAYS) out.push(['No strenuous physical activity (days 0–' + STRENUOUS_DAYS + ').']);
  if (n >= CONFIG.graftBrushDay) out.push([BRUSH_TXT, '', CONFIG.graftBrushDay]);
  if (S.setup.meds.metronidazole && S.setup.meds.metronidazole.on && !isFinished('metronidazole')) out.push(['No alcohol while taking metronidazole.', 'warn']);
  out.push(['Avoid clenching or grinding your teeth.', '', 0]);
  return out;
}
// Safety warnings stay visible; everything else sits in one "Remember today" fold (open on surgery day).
// foldOpen keeps a fold open across re-renders, per day.
const foldOpen = {};
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.fold) foldOpen[e.target.dataset.fold] = e.target.open; }, true);
function notesHTML(n, s, now){
  const all = dayNotes(n, s, now), warn = all.filter(x => x[1] === 'warn'), rest = all.filter(x => x[1] !== 'warn'),
    daily = rest.filter(x => x[2] != null && n > x[2]), today = rest.filter(x => !daily.includes(x));
  const li = ([t,c]) => `<li class="${c||''}">${esc(t)}</li>`, key = 'remember:' + n, open = foldOpen[key] ?? n === 0;
  const tomorrow = n <= PLAN_DAYS ? comingUp(n, s) : '';
  let h = warn.length ? `<ul class="notes" id="notes-warn">${warn.map(li).join('')}</ul>` : '';
  const count = today.length + daily.length;
  if (count || tomorrow) {
    h += `<details class="fold" id="remember" data-fold="${key}"${open ? ' open' : ''}><summary><span>Remember today${count ? ' (' + count + ')' : ''}${tomorrow ? '<small>and what’s coming up tomorrow</small>' : ''}</span></summary>`;
    if (today.length) h += `<ul class="notes" id="notes-today">${today.map(li).join('')}</ul>`;
    if (daily.length) h += `<h3 class="sublabel">Every day</h3><ul class="notes" id="everyday">${daily.map(li).join('')}</ul>`;
    if (tomorrow) h += `<p class="coming"><b>Coming up tomorrow:</b> ${esc(tomorrow)}</p>`;
    h += `</details>`;
  }
  return h;
}
function comingUp(n, s){
  const st = S.setup, t = n + 1, R = CONFIG.rinseDays, m = {};
  const add = (d, txt) => { if (txt) m[d] = m[d] ? m[d] + ' ' + txt : txt; };
  add(1, 'Salt-water rinses after each meal start. You can return to work.');
  add(2, 'At ' + fmt(new Date(s.getTime() + 48*H)) + ' the first 48 hours end (no smoking, no alcohol until then).');
  add(3, 'Swelling often peaks on day 3. Ice packs help.');
  add(4, st.curasept ? 'Curasept rinses start: 60 seconds, morning and before bed.' : null);
  if (endRinseText(CONFIG)) add(R+1, endRinseText(CONFIG));
  else { add(R+1, 'Salt-water rinses (days 1–' + R + ') are finished.'); add(STRENUOUS_DAYS+1, 'The days of no strenuous activity (days 0–' + STRENUOUS_DAYS + ') are finished.'); }
  add(CONFIG.graftBrushDay, 'Gum graft area: you can start gentle brushing there.');
  add(PLAN_DAYS+1, 'Your 2-week plan is complete.');
  return m[t] || 'No changes tomorrow. Keep to today’s routine.';
}

// Medicine items for today: the dose due now (if any) plus the planned chain for the rest of today.
function medItems(now){
  if (!CONFIG.medTiming) return [];
  const st = S.setup, items = [], endDay = addDays(midnight(now),1);
  for (const k of activeMeds()){
    const med = MEDS[k];
    if (med.kind === 'prn' || isFinished(k)) continue;
    const nd = medStart(st, S, k);
    if (!nd) continue;
    const label = med.name + ' ' + med.dose, note = med.kind === 'pain' ? 'After eating.' : (k === 'metronidazole' ? 'With food. No alcohol.' : 'Until the course is finished.');
    if (nd <= now) items.push({med:k, t:nd, title:label, detail:note, due:true});
    let t = nd <= now ? nextDue(now, med.h, st.wake, st.bed) : nd, first = nd > now;
    while (t < endDay){ items.push({med:k, t, title:label, detail: first ? note : 'Planned. Depends on when you take the dose before.', planned:true}); first = false; t = nextDue(t, med.h, st.wake, st.bed); }
  }
  return items;
}

function itemHTML(it, now, key){
  const late = it.t <= addMin(now,-30);
  const whenTxt = it.t <= now ? (late ? 'since ' + whenStr(it.t, now) : 'now') : fmt(it.t);
  if (it.med){
    if (it.due) return `<li class="item ${late?'late':''}"><span class="dot" aria-hidden="true"></span><div class="txt"><div class="t">${esc(it.title)}</div><div class="d">${esc(it.detail)} Due ${whenTxt}.</div></div><button type="button" class="btn small" data-act="take:${it.med}">Taken</button>
      <div class="full">${flash.early === it.med && flash.earlyAt ? earlyAtHTML(it.med) : takeAtBtn(it.med) + takeAtHTML(it.med)}</div></li>`;
    return `<li class="item"><span class="dot" aria-hidden="true"></span><div class="txt"><div class="t">${esc(it.title)}</div><div class="d">${esc(it.detail)}</div></div><span class="when">${fmt(it.t)}</span></li>`;
  }
  const on = !!S.ticks[key];
  return `<li class="item ${late && !on ? 'late':''}"><button type="button" class="tick ${on?'on':''}" data-act="tick:${esc(key)}" aria-pressed="${on}" aria-label="${on?'Mark not done':'Mark done'}: ${esc(it.title)}">${CHECK}</button>
    <div class="txt"><div class="t">${esc(it.title)}</div>${it.detail ? `<div class="d">${esc(it.detail)}</div>` : ''}</div><span class="when">${on ? 'done' : whenTxt}</span></li>`;
}

// Older saved data may have no clinic number: ask for it at the top of Today.
const addClinicHTML = () => clinicNum() ? '' : `<section class="msg warn" id="addclinic"><p>Add your clinic’s phone number so you can call them quickly.</p>
  <div class="row"><button type="button" class="btn small" data-act="add-clinic">Open Settings</button></div></section>`;

function todayHTML(now){
  const st = S.setup, s = new Date(st.surgery), n = dayIdx(s, now), dk = dateKey(now);
  if (n < 0){
    return addClinicHTML() + `<section class="now"><h2>Your plan starts on surgery day</h2><p>Surgery: ${esc(longDay(s))} at ${fmt(s)}. This screen will show what to do and when from then on.</p></section>
      ${medRemindHTML(now)}${calLinkHTML(n)}`;
  }
  const tasks = n <= PLAN_DAYS ? tasksFor(st, Object.assign({}, S, {finished: finMap()}), now, CONFIG) : [];
  const meds = medItems(now);
  const keyOf = it => dk + '|' + it.id;
  const nowList = [], later = [], done = [];
  tasks.forEach(it => { if (S.ticks[keyOf(it)]) done.push(it); else (it.t <= now ? nowList : later).push(it); });
  meds.forEach(it => (it.due ? nowList : later).push(it));
  nowList.sort((a,b) => a.t - b.t); later.sort((a,b) => a.t - b.t);
  // Salt-water rinse how-to once a day: as a line under the first rinse still to do; other rinses show title + time only.
  const firstRinse = [...nowList, ...later].find(it => /^rinse-/.test(it.id || ''));
  [...nowList, ...later, ...done].forEach(it => { if (/^rinse-/.test(it.id || '')) it.detail = it === firstRinse ? RINSE : ''; });
  const nextUp = later[0];
  const doseToday = activeMeds().flatMap(k => (S.doses[k]||[]).map(iso => ({k, t:new Date(iso)}))).filter(x => sameDay(x.t, now)).sort((a,b) => a.t - b.t);

  let h = addClinicHTML() + `<section class="now" aria-labelledby="nowh"><h2 id="nowh">Now</h2>`;
  h += nowList.length ? `<ul class="list">${nowList.map(it => itemHTML(it, now, keyOf(it))).join('')}</ul>`
    : `<p class="empty">Nothing due right now.${nextUp ? ' Next: ' + esc(nextUp.title) + ' at ' + fmt(nextUp.t) + '.' : ''}</p>`;
  if (n >= 1 && n <= CONFIG.rinseDays){   // only matters while salt-water rinses are due; sits with the rinses it moves
    h += `<div class="eatbox"><button type="button" class="btn line eat" data-act="eat">I’ve just eaten</button>
      <p class="eathint">Ate at a different time, or had a snack? Tap this so your rinse reminder matches.</p>`;
    if (flash.eat) h += `<div class="msg" role="status">${flash.eat}</div>`;
    h += `</div>`;
  }
  h += `</section>` + medRemindHTML(now);

  if (later.length) h += `<section><h2 class="label">Later today</h2><ul class="list">${later.map(it => itemHTML(it, now, keyOf(it))).join('')}</ul></section>`;

  h += `<section>${notesHTML(n, s, now)}</section>`;

  if (done.length || doseToday.length){
    h += `<section class="done"><h2 class="label">Done today</h2><ul class="list">${done.map(it => itemHTML(it, now, keyOf(it))).join('')}`;
    h += doseToday.map(x => { const last = (S.doses[x.k]||[]).slice(-1)[0] === x.t.toISOString();
      return `<li class="item"><span class="tick on" aria-hidden="true">${CHECK}</span><div class="txt"><div class="t">${esc(MEDS[x.k].name)}</div><div class="d">Taken at ${fmt(x.t)}</div></div>${last ? `<button type="button" class="btn small line" data-act="undo:${x.k}">Undo</button>` : '<span></span>'}</li>`; }).join('');
    h += `</ul></section>`;
  }
  if (CONFIG.feedbackUrl){
    if (n >= 3 && n <= 4) h += fbCardHTML('d3', 'How is the app going?', 'Two quick questions to help us improve it. About 30 seconds.', 'Answer now', 'Day 3 check-in');
    if (n >= 12) h += fbCardHTML('d12', 'Did the app help your recovery?', 'A short survey to help the clinic decide whether to keep using it. About 2 minutes.', 'Take the survey', 'Day 12 survey', now);
  }
  return h + calLinkHTML(n);
}
// Today, days 0–1 (and before surgery): one line pointing to the calendar setup in Settings.
const calLinkHTML = n => n <= 1 ? `<p id="callink"><button type="button" class="linkbtn u" data-act="cal-setup">Set up phone reminders →</button></p>` : '';

// Today: one prominent box listing each scheduled medicine's next-dose reminder (medTiming only).
function medRemindHTML(now){
  if (!CONFIG.medTiming) return '';
  const rows = []; let miss = false;
  for (const k of activeMeds()){
    const med = MEDS[k];
    if (med.kind === 'prn' || isFinished(k)) continue;
    const nd = medStart(S.setup, S, k);
    if (!nd) continue;
    const name = esc(med.name), w = esc(whenStr(nd, now));
    if (nd <= now){ rows.push(`<div class="mr" data-med="${k}"><p><b>${name}</b>: take your dose first, then add the next reminder.</p></div>`); continue; }
    if (isReminded(k, nd)){ rows.push(`<div class="mr" data-med="${k}"><p><b>✓ ${name} reminder set for ${w}</b></p></div>`); continue; }
    miss = true;
    const tk = justTaken(k);
    rows.push(`<div class="mr" data-med="${k}"><p class="ln"${tk ? ' role="status"' : ''}><b>${name}</b>: ${tk ? `not before ${w} · taken ${fmt(tk)}` : `next dose ${w}`}</p>${remindBtnHTML(k, nd, now, false)}${confirmHTML(k, nd, now)}</div>`);
  }
  if (!rows.length) return '';
  return `<section class="card medrem ${miss ? 'miss' : ''}" id="medrem" aria-labelledby="medremh"><h2 id="medremh">Medicine reminders</h2>${rows.join('')}
    <p class="sub">Medicine reminders are added one dose at a time, so they always follow when you really took your last dose. Never take two doses at once.</p></section>`;
}

// Settings: calendar setup for the routine (non-medicine) reminders.
function calHTML(){
  const L = calLinks(S.setup, CONFIG);
  return `<section id="calsec" aria-labelledby="calh"><h2 class="label" id="calh">Phone reminders</h2>
    <p>${CONFIG.medTiming ? 'Add your rinse and recovery reminders to your phone’s calendar. It will remind you even when this app is closed.' : 'Add these to your phone’s calendar and it will remind you even when this app is closed.'}</p>
    ${CONFIG.medTiming ? '<p class="sub" id="calmed"><b>Medicines are not in this file:</b> they are added one dose at a time from the Medicine reminders box on Today.</p>' : ''}
    <button type="button" class="btn wide" data-act="ics">Add all reminders to my calendar</button>
    <p class="sub">On iPhone, the calendar file opens with an “Add All” button. Tap it.</p>
    ${flash.ics ? `<div class="msg" role="status">${esc(flash.ics)}</div>` : ''}
    <h3 class="calsub">Or add one at a time to Google Calendar</h3>
    <ul class="list">${L.map(x => `<li class="item cal"><div class="txt"><div class="t">${esc(x.label)}</div><div class="d">${esc(x.when)}</div></div><a class="btn small line" href="${esc(x.url)}" target="_blank" rel="noopener">Add</a></li>`).join('')}</ul>
    </section>`;
}

function saveICS(text, name){
  const url = URL.createObjectURL(new Blob([text], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function downloadICS(){
  const now = appNow(), r = buildICS(S.setup, Object.assign({}, S, {finished: finMap()}), CONFIG, {from: addMin(now,-1), now: new Date()});
  if (!r.count) flash.ics = 'There are no reminders left to add.';
  else {
    saveICS(r.text, 'graft-recovery.ics'); S.use.allCal++; save();
    flash.ics = r.count + ' reminders are in the file graft-recovery.ics. Open it to add them to your calendar.';
  }
  const c = $('#calsec');   // on Settings, redraw only this section so unsaved form edits are kept
  if (tab === 'setup' && c) c.outerHTML = calHTML(); else render();
}
function downloadDose(k){
  const now = appNow(), nd = medStart(S.setup, S, k);
  if (!nd || nd <= now){ render(); return; }
  saveICS(buildDoseICS(k, nd, {now: new Date()}).text, 'next-dose-' + k + '.ics');
  flash.confirm = {k, iso: nd.toISOString(), via:'ics'};   // recorded only when the patient says it saved
  render();
}

function medNotesHTML(k){
  const med = MEDS[k];
  return `<ul class="small-notes">${med.notes.map(x => `<li>${esc(x)}</li>`).join('')}${med.kind === 'abx' ? `<li>${esc(ABX_NOTE)}</li>` : ''}</ul>`;
}
function finishHTML(k){
  const med = MEDS[k];
  if (med.kind !== 'abx' || isFinished(k)) return '';
  const end = courseEnd(k);
  const endTxt = end ? `<p class="sub">Your ${esc(S.setup.abxDays)}-day course: reminders stop on ${esc(longDay(end))}. Finished sooner? Tap below.</p>` : '';
  return endTxt + (flash.finish === k
    ? `<div class="msg"><p>Have you taken every ${esc(med.name.toLowerCase())} dose?</p><div class="row"><button type="button" class="btn small" data-act="finish-yes:${k}">Yes, all finished</button><button type="button" class="btn small line" data-act="finish-no">Not yet</button></div></div>`
    : `<button type="button" class="btn line" data-act="finish:${k}">Finished my course</button>`);
}
const finishedHTML = k => `<p class="due">Course finished</p><p class="sub">${autoEnded(k) ? 'Your ' + esc(S.setup.abxDays) + '-day course ended' : 'Finished'} ${esc(longDay(finishedAt(k)))}. Probiotic drink or yogurt daily for 3 days is on your Today list.</p>`;

function medsHTML(now){
  const st = S.setup, ks = activeMeds();
  if (!ks.length) return `<section class="card"><h3>No medicines set</h3><p>Tick the medicines you were given in Settings.</p><button type="button" class="btn" data-act="tab:setup">Open Settings</button></section>`;
  let h = '';
  if (!CONFIG.medTiming){
    // Simple mode: log doses only. The patient follows the timing on their prescription label.
    h += `<div class="msg"><p><b>Follow the timing on your prescription label.</b></p></div>`;
    for (const k of ks){
      const med = MEDS[k], log = S.doses[k] || [], last = log.length ? new Date(log[log.length-1]) : null;
      h += `<section class="card" aria-label="${esc(med.name)}"><h3>${esc(med.name)} <span class="sub">${esc(med.dose)}</span></h3>`;
      if (isFinished(k)) h += finishedHTML(k);
      else {
        h += last ? `<p class="due">Last taken ${esc(whenStr(last, now))}</p>` : `<p class="sub">Tap “Taken now” each time you take a dose.</p>`;
        h += `<div class="row"><button type="button" class="btn" data-act="take:${k}">Taken now</button>${last ? `<button type="button" class="btn small line" data-act="undo:${k}">Undo</button>` : ''}${takeAtBtn(k)}</div>${takeAtHTML(k)}`;
      }
      h += medNotesHTML(k) + finishHTML(k) + `</section>`;
    }
    return h + `<p class="foot">Not taking one any more? Untick it in Settings.</p>`;
  }
  for (const k of ks){
    const med = MEDS[k], log = S.doses[k] || [], last = log.length ? new Date(log[log.length-1]) : null;
    h += `<section class="card" aria-label="${esc(med.name)}"><h3>${esc(med.name)} <span class="sub">${esc(med.dose)}</span></h3>`;
    if (isFinished(k)){
      h += finishedHTML(k);
    } else {
      const nd = medStart(st, S, k);
      let tk = null;   // just taken: its time goes in the heading
      if (med.kind === 'prn'){
        h += `<p class="sub">Only when needed. No scheduled reminders.</p>`;
        h += nd && nd > now ? `<p class="due">Not before ${esc(whenStr(nd, now))}</p>` : `<p class="due">Can take if needed</p>`;
      } else if (!nd){
        h += `<p class="sub">Tap “Taken now” when you take your next dose. The next one will be worked out from that.</p>`;
      } else {
        const late = nd <= addMin(now,-30);
        tk = nd > now ? justTaken(k) : null;
        h += `<p class="due ${late?'late':''}"${tk ? ' role="status"' : ''}>${nd <= now ? (late ? 'Overdue since ' + esc(whenStr(nd, now)) : 'Due now') : tk ? `Not before ${esc(whenStr(nd, now))}<span class="tk"> · taken ${fmt(tk)}</span>` : 'Next due ' + esc(whenStr(nd, now))}</p>`;
        if (late) h += `<p class="sub">Take it now if you still need it, then the next one is worked out from when you take it. Never take two doses at once.</p>`;
        if (nd > now){
          const done = isReminded(k, nd);
          if (done) h += `<p><b>✓ Reminder set for ${esc(whenStr(nd, now))}</b></p>`;
          h += remindBtnHTML(k, nd, now, done) + confirmHTML(k, nd, now);
        }
      }
      if (last && !tk) h += `<p class="sub">Last taken ${esc(whenStr(last, now))}.</p>`;
      if (k === 'paracetamol' || k === 'cocodamol'){
        const ib = (S.doses.ibuprofen||[]).slice(-1)[0];
        if (ib && st.meds.ibuprofen && st.meds.ibuprofen.on) h += `<p class="sub">4 hours after your last ibuprofen: ${esc(whenStr(new Date(new Date(ib).getTime()+4*H), now))}.</p>`;
      }
      if (flash.early === k && flash.earlyAt){
        h += earlyAtHTML(k);
      } else if (flash.early === k){
        h += `<div class="msg warn"><p>It isn’t ${esc(fmt(nd))} yet. The gap between doses should not be shortened. Log a dose taken now anyway?</p>
          <div class="row"><button type="button" class="btn small" data-act="take-force:${k}">Yes, I took it</button><button type="button" class="btn small line" data-act="early-no">No, go back</button></div></div>`;
      } else {
        h += `<div class="row"><button type="button" class="btn" data-act="take:${k}">Taken now</button>${last ? `<button type="button" class="btn small line" data-act="undo:${k}">Undo last</button>` : ''}${takeAtBtn(k)}</div>${takeAtHTML(k)}`;
      }
    }
    h += medNotesHTML(k) + finishHTML(k) + `</section>`;
  }
  return h + `<p class="foot">Not taking one any more? Untick it in Settings.</p>`;
}

function setupHTML(){
  const st = S.setup || defaults(), first = !S.setup;
  const f = (id, label, type, val) => `<div class="f"><label for="${id}">${label}</label><input type="${type}" id="${id}" value="${esc(val)}"></div>`;
  const ck = (id, label, on, sub) => `<label class="check"><input type="checkbox" id="${id}" ${on?'checked':''}><span>${label}${sub ? `<small>${sub}</small>` : ''}</span></label>`;
  // Grouped in MEDS order: painkillers, antibiotics (then course length), decongestants.
  const GROUPS = {pain:'Painkillers', abx:'Antibiotics', prn:'Decongestants'};
  const abxOn = Object.keys(MEDS).some(k => MEDS[k].kind === 'abx' && (st.meds[k]||{}).on);
  let meds = '', lastKind = null;
  for (const k of Object.keys(MEDS)){
    const m = st.meds[k] || {}, med = MEDS[k];
    if (med.kind !== lastKind){
      if (lastKind === 'abx') meds += `<div id="abxf" ${abxOn ? '' : 'hidden'}>${f('s-abx','Antibiotic course length (days)','number',st.abxDays)}</div>`;
      meds += `<h3 class="sublabel medgroup">${GROUPS[med.kind] || ''}</h3>`; lastKind = med.kind;
    }
    meds += `<div class="medset">${ck('m-'+k, esc(med.name), m.on, esc(med.dose) + (med.kind === 'prn' ? ' · only when needed' : ''))}
      ${med.kind === 'prn' || !CONFIG.medTiming ? '' : `<div class="f" id="mf-${k}" ${m.on?'':'hidden'}><label for="mt-${k}">Next dose due at</label><input type="time" id="mt-${k}" value="${esc(m.next||'')}" aria-describedby="mterr-${k}"><div id="mterr-${k}" class="msg warn" role="alert" hidden></div></div>`}</div>`;
  }
  // Clinic phone is required (it feeds the call links); the periodontist mobile stays optional.
  const clinicF = `<div class="f"><label for="s-clinic">Clinic phone (needed to call the clinic)</label><input type="tel" id="s-clinic" value="${esc(st.clinic)}" autocomplete="tel" required aria-required="true" aria-describedby="clinic-err"><div id="clinic-err" class="msg warn" role="alert" hidden></div></div>`;
  const phones = (P.phone ? '' : clinicF) + (P.mobile ? '' : f('s-perio','Periodontist mobile (optional)','tel',st.perio));
  return `<div class="intro">${first ? '<h1>Let’s set up your plan</h1><p class="sub">About 30 seconds. You can change any of this later in Settings.</p>' : '<h1>Settings</h1>'}</div>
  <form id="setup" novalidate>
    <fieldset><legend>Surgery</legend>${f('s-surgery','Surgery date and time','datetime-local',st.surgery)}
      ${ck('s-sed','I had sedation (pills or IV)',st.sedation)}${ck('s-cura','I was given Curasept mouthwash',st.curasept)}</fieldset>
    <fieldset><legend>Medicines you were given</legend>${meds}
</fieldset>
    <details class="fold" id="times"><summary><span>Change meal and sleep times (optional)<small id="times-sum">${esc(timesSummary(st))}</small></span></summary>
      <fieldset><legend>Your day</legend><div class="grid3">${f('s-b','Breakfast','time',st.breakfast)}${f('s-l','Lunch','time',st.lunch)}${f('s-d','Dinner','time',st.dinner)}</div>
      <div class="grid2">${f('s-wake','Wake-up time','time',st.wake)}${f('s-bed','Bedtime','time',st.bed)}</div></fieldset></details>
    ${phones ? `<fieldset><legend>Phone numbers</legend>${phones}</fieldset>` : ''}
    <div id="setup-err" class="msg warn" role="alert" hidden></div>
    <p class="consent" id="setup-privacy">${PRIVACY}</p>
    <button type="submit" class="btn wide">${first ? 'Start my plan' : 'Save'}</button>
    ${first ? '' : '<button type="button" class="btn line wide" data-act="tab:today">Cancel</button>'}
  </form>
  ${first ? '' : calHTML()}
  ${first ? '' : (flash.reset
    ? `<div class="msg warn" role="alert"><p>This erases your plan, ticks and medicine log on this phone. You will start setup again.</p>
        <div class="row"><button type="button" class="btn small" data-act="reset-yes">Yes, start over</button><button type="button" class="btn small line" data-act="reset-no">Keep my plan</button></div></div>`
    : `<button type="button" class="btn line wide" data-act="reset">Start over</button>`)}`;
}
// Summary line of the closed "meal and sleep times" group in Setup.
const timesSummary = t => 'Breakfast ' + t.breakfast + ' · Lunch ' + t.lunch + ' · Dinner ' + t.dinner + ' · Wake ' + t.wake + ' · Sleep ' + t.bed;
function wireSetup(){
  const form = $('#setup');
  Object.keys(MEDS).forEach(k => { const c = $('#m-'+k), fb = $('#mf-'+k); if (c && fb) c.addEventListener('change', () => { fb.hidden = !c.checked; }); });
  // Antibiotic course length only matters when an antibiotic (amoxicillin, metronidazole) is ticked.
  const abxKeys = Object.keys(MEDS).filter(k => MEDS[k].kind === 'abx');
  abxKeys.forEach(k => $('#m-'+k).addEventListener('change', () => { $('#abxf').hidden = !abxKeys.some(a => $('#m-'+a).checked); }));
  $('#times').addEventListener('input', () => { const v = id => $('#'+id).value || '--:--';
    $('#times-sum').textContent = timesSummary({breakfast:v('s-b'), lunch:v('s-l'), dinner:v('s-d'), wake:v('s-wake'), bed:v('s-bed')}); });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = id => { const el = $('#'+id); return el ? el.value.trim() : ''; };
    const err = $('#setup-err'), cel = $('#s-clinic'), cerr = $('#clinic-err');
    err.hidden = true; if (cerr){ cerr.hidden = true; cel.removeAttribute('aria-invalid'); }
    const surg = v('s-surgery');
    if (!surg || isNaN(new Date(surg))){ err.textContent = 'Please enter your surgery date and time.'; err.hidden = false; return; }
    for (const id of ['s-b','s-l','s-d','s-wake','s-bed']) if (!v(id)){   // open the times group so the empty field can be seen
      err.textContent = 'Please fill in all the meal and sleep times.'; err.hidden = false; $('#times').open = true; $('#'+id).focus(); return; }
    // Every ticked medicine with timing needs its next-dose time, or its reminders can't be worked out.
    document.querySelectorAll('[id^="mterr-"]').forEach(x => { x.hidden = true; });
    document.querySelectorAll('[id^="mt-"]').forEach(x => x.removeAttribute('aria-invalid'));
    for (const k of Object.keys(MEDS)){
      const t = $('#mt-'+k);
      if (t && $('#m-'+k).checked && !t.value){
        const me = $('#mterr-'+k); me.textContent = 'Please enter when your next ' + MEDS[k].name.toLowerCase() + ' dose is due.'; me.hidden = false;
        t.setAttribute('aria-invalid','true'); t.focus({preventScroll:true}); t.scrollIntoView({block:'center'}); return;
      }
    }
    if (cel && v('s-clinic').replace(/\D/g,'').length < 7){
      cerr.textContent = 'Please enter your clinic’s phone number (at least 7 digits). You’ll need it to call them quickly.'; cerr.hidden = false;
      cel.setAttribute('aria-invalid','true'); cel.focus({preventScroll:true}); cel.scrollIntoView({block:'center'}); return;
    }
    const old = S.setup || defaults(), now = appNow();
    const base = new Date(Math.max(now, new Date(surg)));
    const meds = {};
    for (const k of Object.keys(MEDS)){
      const on = $('#m-'+k).checked, t = $('#mt-'+k), o = old.meds[k] || {}, next = t ? t.value : (o.next || '');
      meds[k] = {on, next, nextAt: !next ? null : (next === o.next && o.nextAt) ? o.nextAt : resolveNext(next, base).toISOString()};
    }
    const days = Math.max(1, Math.min(30, parseInt(v('s-abx'),10) || 7));
    S.setup = {surgery:surg, wake:v('s-wake'), bed:v('s-bed'), breakfast:v('s-b'), lunch:v('s-l'), dinner:v('s-d'),
      sedation:$('#s-sed').checked, curasept:$('#s-cura').checked, meds, abxDays:days,
      clinic: P.phone ? old.clinic : v('s-clinic'), perio: P.mobile ? old.perio : v('s-perio')};
    save(); tab = 'today'; flash = {}; render(); window.scrollTo(0,0);
  });
}

/* ---------- actions ---------- */
document.addEventListener('change', e => {   // day 12 survey: add or drop the usage summary from the link
  if (e.target.id !== 'fb-share') return;
  shareUsage = e.target.checked;
  const a = $('#fb-go-d12'), u = $('#fb-usage'); if (a) a.href = fbHref(a.dataset.stage, shareUsage && u ? u.textContent : '');
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(/:(.*)/s);
  const now = appNow();
  if (act === 'gcal'){   // let the link open first, then ask whether it saved
    const nd = medStart(S.setup, S, arg);
    if (nd && nd > now) flash.confirm = {k:arg, iso:nd.toISOString(), via:'gcal'};
    setTimeout(render, 0); return;
  }
  if (act === 'fb'){ S.fb[arg] = now.toISOString(); save(); setTimeout(render, 0); return; }   // link opens first, then the card goes
  if (act !== 'dose-ics' && act !== 'remind-yes' && act !== 'remind-no'){ flash.taken = null; flash.confirm = null; }
  if (!act.startsWith('take-at')){ flash.takeAt = null; flash.takeAtErr = null; }
  if (act === 'reset'){ flash.reset = true; render(); return; }
  if (act === 'reset-no'){ flash = {}; render(); return; }
  if (act === 'reset-yes'){ S = blank(); try { localStorage.removeItem(KEY); } catch(e) {} flash = {}; previewDay = null; tab = 'setup'; render(); window.scrollTo(0,0); return; }
  if (act === 'tab'){ tab = arg; flash = {}; render(); window.scrollTo(0,0); return; }
  if (act === 'cal-setup'){ tab = 'setup'; flash = {}; render(); const c = $('#calsec'); if (c) c.scrollIntoView({block:'start'}); return; }
  if (act === 'add-clinic'){ tab = 'setup'; flash = {}; render(); const el = $('#s-clinic'); if (el){ el.focus({preventScroll:true}); el.scrollIntoView({block:'center'}); } return; }
  if (act === 'tick'){ if (S.ticks[arg]) delete S.ticks[arg]; else S.ticks[arg] = now.toISOString(); save(); render(); return; }
  if (act === 'take' || act === 'take-force'){
    if (CONFIG.medTiming){
      const nd = medStart(S.setup, S, arg);
      if (act === 'take' && nd && nd > addMin(now, 5) && (S.doses[arg]||[]).length && MEDS[arg].kind !== 'prn'){ flash.early = arg; flash.earlyAt = null; tab = 'meds'; render(); return; }
      if (act === 'take' && nd && nd > now && MEDS[arg].kind === 'prn'){ flash.early = arg; flash.earlyAt = null; render(); return; }
    }
    (S.doses[arg] = S.doses[arg] || []).push(now.toISOString()); flash.early = null; flash.earlyAt = null; flash.taken = arg;   // stay on this tab: Today and Medicines both show the next-dose reminder prompt
    save(); render(); return;
  }
  // "Took it earlier?" -> time form -> same checks as "Taken", with the chosen time. Stays on this tab.
  if (act === 'take-at'){
    flash.early = null; flash.earlyAt = null; flash.takeAtErr = null;
    if (flash.takeAt === arg){ flash.takeAt = null; render(); return; }
    flash.takeAt = arg; flash.takeAtVal = fmt(new Date(Math.round(addMin(now,-30) / (5*MIN)) * 5*MIN));
    render(); focusTakeAt(); return;
  }
  if (act === 'take-at-no'){ flash.takeAt = null; flash.takeAtErr = null; render(); return; }
  if (act === 'take-at-save'){
    const el = document.getElementById('tat-' + arg), v = el ? el.value : '', r = takeAtTime(arg, v, now);
    flash.takeAt = arg; flash.takeAtVal = v;
    if (r.err){ flash.takeAtErr = r.err; render(); focusTakeAt(); return; }
    const nd = medStart(S.setup, S, arg);
    if (CONFIG.medTiming && MEDS[arg].kind !== 'prn' && (S.doses[arg]||[]).length && nd && r.t < addMin(nd, -5)){
      flash.takeAt = null; flash.takeAtErr = null; flash.early = arg; flash.earlyAt = r.t.toISOString(); render(); return;
    }
    addDose(arg, r.t); return;
  }
  if (act === 'take-at-force'){ if (flash.early === arg && flash.earlyAt) addDose(arg, new Date(flash.earlyAt)); else render(); return; }
  if (act === 'early-no'){
    if (flash.earlyAt){ flash.takeAt = flash.early; flash.early = null; flash.earlyAt = null; render(); focusTakeAt(); return; }   // back to the time form
    flash.early = null; render(); return;
  }
  if (act === 'undo'){ const L = S.doses[arg] || []; L.sort(); L.pop(); save(); render(); return; }   // most recent dose by time
  if (act === 'finish'){ flash.finish = arg; render(); return; }
  if (act === 'finish-no'){ flash.finish = null; render(); return; }
  if (act === 'finish-yes'){ S.finished[arg] = now.toISOString(); flash.finish = null; save(); render(); return; }
  if (act === 'ics'){ downloadICS(); return; }
  if (act === 'dose-ics'){ downloadDose(arg); return; }
  if (act === 'remind-yes'){ if (pendingConfirm(arg, medStart(S.setup, S, arg))) markReminded(arg); flash.confirm = null; render(); return; }
  if (act === 'remind-no'){ flash.confirm = null; render(); return; }
  if (act === 'eat'){
    S.meals.push(now.toISOString()); S.meals = S.meals.slice(-60); save();
    const n = dayIdx(new Date(S.setup.surgery), now), pain = activeMeds().some(k => MEDS[k].kind === 'pain');
    const parts = ['Meal logged at ' + fmt(now) + '.'];
    if (n >= 1 && n <= CONFIG.rinseDays) parts.push('Your salt-water rinse is now in the Now list.');
    if (pain) parts.push(CONFIG.medTiming ? 'Pain medicine is taken after eating. Any dose that is due is in the Now list.' : 'Pain medicine is taken after eating.');
    flash.eat = parts.map(esc).join(' '); render(); return;
  }
  if (act === 'copy'){
    const el = document.getElementById(arg), txt = el ? el.textContent : '';
    const selectIt = () => { try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch(_){} };
    try { navigator.clipboard.writeText(txt).then(() => { flash.copied = arg; render(); }, selectIt); } catch(_) { selectIt(); }
    return;
  }
});

render();
setInterval(() => { if (tab !== 'setup') render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab !== 'setup') render(); });
</script>
</body>
</html>
